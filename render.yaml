services:
  - type: web
    runtime: static
    name: dia
    staticPublishPath: .
    # There is no build step: the browser runs the files in this repository as written.
    # Render requires a build command for non-Docker services, so this is a deliberate
    # no-op rather than an omission.
    buildCommand: echo "No build step - static files are served as committed."
    pullRequestPreviewsEnabled: false
    headers:
      # No document data may leave the browser. connect-src 'none' blocks fetch/XHR/
      # WebSocket/sendBeacon; default-src 'none' means anything not listed is denied,
      # so an injected <img src="/px?name=..."> cannot reach the origin either.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; manifest-src 'self'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
